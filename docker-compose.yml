services:
  postgres:
    image: postgres:17-alpine
    container_name: central-producao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: house190
      POSTGRES_PASSWORD: house190
      POSTGRES_DB: central_producao
    ports:
      - "5432:5432"
    volumes:
      - central_producao_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U house190 -d central_producao"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  central_producao_data:
